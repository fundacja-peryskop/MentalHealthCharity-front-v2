name: Setup
description: Install Node (version from .nvmrc) and the locked npm dependencies.

inputs:
  token:
    description: >-
      Token that can read the @fundacja-peryskop packages on GitHub Packages.
      The committed .npmrc reads it from the GITHUB_TOKEN environment variable.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        # CI never commits, so skip installing the git hooks.
        HUSKY: "0"
